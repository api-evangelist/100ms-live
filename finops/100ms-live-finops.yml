specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: 100ms
providerId: 100ms-live
created: '2026-05-25'
modified: '2026-05-25'
reconciled: true
tags:
  - FinOps
  - Cost Management
  - FOCUS
  - Live Video
  - Streaming
description: >
  FOCUS-aligned FinOps definition for 100ms. 100ms bills usage per minute across
  several independent meters - peer-minutes for audio and video (HD/FHD), output
  minutes for HLS, RTMP-out, composite recording, and transcription - all rolled
  up into a single monthly invoice. Each meter is a separate FOCUS ServiceCategory
  line item, simplifying chargeback to business units that own a use case
  (telehealth, live shopping, edtech) rather than the underlying technology.
sources:
  - https://www.100ms.live/pricing
  - https://www.100ms.live/docs/server-side/v2/foundation/basics
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: 100ms (a Disney+ Hotstar company)
serviceCategory: Networking and Content Delivery
billingModel:
  pricingCategory: Usage-Based
  pricingUnit: minute
  pricingCurrency: USD
  invoicingCadence: monthly
  commitments:
    - type: Free Tier
      description: 10,000 free minutes per month across all meters.
    - type: Committed Use (Enterprise)
      description: Negotiated peer-minute and output-minute commitments for IPL-scale customers.
meters:
  - name: audio.peer-minutes
    description: Audio-only participation per peer per minute.
    unit: peer-minute
    focusServiceCategory: Networking and Content Delivery
  - name: video.hd.peer-minutes
    description: HD (up to 720p) video participation per peer per minute.
    unit: peer-minute
    focusServiceCategory: Networking and Content Delivery
  - name: video.fhd.peer-minutes
    description: Full-HD (1080p) video participation per peer per minute.
    unit: peer-minute
    focusServiceCategory: Networking and Content Delivery
  - name: hls.output-minutes
    description: HLS broadcast output per minute.
    unit: output-minute
    focusServiceCategory: Networking and Content Delivery
  - name: rtmp-out.output-minutes
    description: RTMP push to YouTube/Twitch/Facebook per minute.
    unit: output-minute
    focusServiceCategory: Networking and Content Delivery
  - name: recording.output-minutes
    description: Composite recording per output minute (stored to AWS S3 destination).
    unit: output-minute
    focusServiceCategory: Storage
  - name: transcription.minutes
    description: Live transcription / closed-caption minutes (AI).
    unit: minute
    focusServiceCategory: AI and Machine Learning
chargebackRecommendation: >
  Tag rooms and templates with the consuming business unit's identifier in `metadata`
  so the webhook event stream and recording assets carry that tag forward. Roll up
  invoice line items by tag via the dashboard export or the /v2/analytics/events API.
