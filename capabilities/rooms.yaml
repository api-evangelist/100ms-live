naftiko: 1.0.0-alpha2
info:
  label: 100ms Server-Side API — Rooms
  description: 'Provision, list, retrieve, update, and enable/disable persistent live-video rooms on 100ms.
    Rooms are the durable container for templates, recordings, sessions, and live streams. Self-contained
    Naftiko capability covering one 100ms business surface.'
  tags:
  - 100ms
  - Live Video
  - Rooms
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    HMS_MANAGEMENT_TOKEN: HMS_MANAGEMENT_TOKEN
capability:
  consumes:
  - type: http
    namespace: rooms
    baseUri: https://api.100ms.live/v2
    description: 100ms Server-Side API — Rooms business capability.
    resources:
    - name: rooms
      path: /rooms
      operations:
      - name: listrooms
        method: GET
        description: List Rooms
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createroom
        method: POST
        description: Create Room
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: room
      path: /rooms/{room_id}
      operations:
      - name: retrieveroom
        method: GET
        description: Retrieve A Room
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: room_id
          in: path
          type: string
          required: true
      - name: updateroom
        method: POST
        description: Update A Room
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: room_id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          required: true
    - name: room-enabled
      path: /rooms/{room_id}/enabled
      operations:
      - name: setroomenabled
        method: POST
        description: Disable Or Enable A Room
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: room_id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          required: true
    authentication:
      type: bearer
      value: '{{env.HMS_MANAGEMENT_TOKEN}}'
      placement: header
  exposes:
  - type: rest
    namespace: rooms-rest
    port: 8080
    description: REST adapter for 100ms Rooms.
    resources:
    - path: /v2/rooms
      name: rooms
      description: REST surface for rooms.
      operations:
      - method: GET
        name: listrooms
        description: List Rooms
        call: rooms.listrooms
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createroom
        description: Create Room
        call: rooms.createroom
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rooms-mcp
    port: 9090
    transport: http
    description: MCP adapter for 100ms Rooms.
    tools:
    - name: hms-list-rooms
      description: List 100ms rooms.
      hints: { readOnly: true, destructive: false, idempotent: true }
      call: rooms.listrooms
      outputParameters:
      - type: object
        mapping: $.
    - name: hms-create-room
      description: Create a 100ms room.
      hints: { readOnly: false, destructive: false, idempotent: false }
      call: rooms.createroom
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: hms-retrieve-room
      description: Retrieve a 100ms room by id.
      hints: { readOnly: true, destructive: false, idempotent: true }
      call: rooms.retrieveroom
      with:
        room_id: tools.room_id
      outputParameters:
      - type: object
        mapping: $.
    - name: hms-update-room
      description: Update a 100ms room.
      hints: { readOnly: false, destructive: false, idempotent: false }
      call: rooms.updateroom
      with:
        room_id: tools.room_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: hms-set-room-enabled
      description: Enable or disable a 100ms room.
      hints: { readOnly: false, destructive: true, idempotent: true }
      call: rooms.setroomenabled
      with:
        room_id: tools.room_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
