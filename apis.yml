description: 100ms is a live video and audio infrastructure company headquartered
  in Bengaluru, India that provides developer SDKs and a REST control plane for embedding
  video conferencing, interactive live streaming (HLS), RTMP ingest/egress, recording,
  real-time chat/messaging, polls, whiteboard, and AI-powered transcription into applications.
  The company was acquired by Disney+ Hotstar (JioCinema/JioHotstar) in 2023 and continues
  to operate as an independent commercial SaaS — the same infrastructure powering
  some of the largest live cricket audiences in the world (IPL on JioCinema/Hotstar).
  The platform exposes a single Server-Side REST API at api.100ms.live/v2 plus client
  SDKs for Web (JavaScript/React), iOS (Swift), Android (Kotlin), React Native, Flutter,
  and a Node.js server SDK, with public OpenAPI specs generated from the docs and
  a Postman collection.
